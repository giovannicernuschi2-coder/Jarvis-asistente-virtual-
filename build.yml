name: Compilar Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto (si subiste el zip)
        run: |
          if [ -f jarvis-android-v12.zip ]; then unzip -q -o jarvis-android-v12.zip; fi
          test -d jarvis-android || { echo "No encuentro la carpeta jarvis-android"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        working-directory: jarvis-android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: jarvis-android/app/build/outputs/apk/debug/*.apk
